name: Load

# Нагрузочный прогон (SD-09, п. 3, решение 3): 10 минут и весь стенд — не на каждый push,
# а по кнопке и раз в неделю
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

concurrency:
  group: load
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # образы сервисов и миграций с node_modules не помещаются на диск раннера:
      # убираем ненужные SDK и предустановленные образы Docker (~35 ГБ)
      - name: Место на диске
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/local/.ghcup /usr/share/swift /usr/local/share/powershell \
            /usr/local/share/chromium /opt/microsoft /opt/google
          docker system prune -af >/dev/null
          df -h /
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - run: pnpm nx run @repo/load:load --output-style=static
      - name: Отчёт k6
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-report
          path: apps/load/test-output/
          if-no-files-found: ignore
