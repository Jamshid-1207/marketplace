name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # SD-01, п. 9. Остальные job'ы (integration, generator-smoke, infra-smoke) добавляются со своими шагами
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # история для сравнения с базовым коммитом (affected)
      - uses: pnpm/action-setup@v6 # версия pnpm — из packageManager
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: nrwl/nx-set-shas@v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm nx sync:check
      - run: pnpm nx affected -t lint typecheck test build
