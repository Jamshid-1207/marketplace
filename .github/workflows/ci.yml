name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read # nx-set-shas ищет последний успешный прогон

jobs:
  # SD-01, п. 9
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # история для сравнения с базовым коммитом (affected)
      - uses: pnpm/action-setup@v6 # версия pnpm — из packageManager
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: nrwl/nx-set-shas@v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm nx sync:check
      - run: pnpm nx affected -t lint typecheck test build

  # Интеграционные тесты libs на Testcontainers: настоящие Postgres и Kafka (SD-01, п. 8)
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: nrwl/nx-set-shas@v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx affected -t test-integration --output-style=static

  # Критерий 3 SD-01: генератор создаёт работающий сервис. Запускается, если изменились
  # генератор или libs, от которых зависит шаблон
  generator-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: nrwl/nx-set-shas@v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx affected -t smoke --output-style=static
      - if: failure()
        run: docker compose --profile core logs --no-color
      - if: always()
        run: docker compose --profile core down -v

  # Критерий 1 SD-01: инфраструктура поднимается, повторный up ничего не ломает
  infra-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - run: bash infra/up.sh
      - run: bash infra/smoke.sh
      - name: Повторный up (provisioning и топики идемпотентны)
        run: |
          bash infra/up.sh
          bash infra/smoke.sh
      - if: failure()
        run: docker compose --profile infra logs --no-color
      - if: always()
        run: docker compose --profile infra down -v
