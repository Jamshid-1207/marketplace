# Топики (ADR-0002, п. 3). Автосоздание выключено: топика, которого здесь нет, не существует.
# Топик появляется вместе с потребителем; DLQ <group>.dlq дописывает генератор сервиса.
# Число партиций после создания не меняется — kafka-init упадёт при расхождении.
#
# имя                         партиции  retention.ms (-1 — бессрочно)
smoke.events                  1         86400000
order.events                  6         -1
payment.events                6         -1
payment.commands              6         604800000
erp.commands                  6         604800000
erp.events                    6         -1
auth.events                   6         -1
catalog.events                6         -1
payment-service.dlq           1         -1
order-service.dlq             1         -1
erp-service.dlq               1         -1
