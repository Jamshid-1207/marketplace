# Локальная инфраструктура (SD-01, п. 5). Запуск: pnpm infra:up (infra/up.sh)
name: marketplace

# Инфраструктура входит во все профили: compose не запускает зависимость из выключенного профиля
x-infra: &infra
  profiles: [infra, core, full]
  restart: unless-stopped

x-oneshot: &oneshot
  profiles: [infra, core, full]
  restart: 'no'

# Инфраструктура ниже; сервисы приложения (<name>-migrate и <name>, профили core/full)
# дописывает в конец генератор: pnpm nx g @repo/generators:service <name>
services:
  postgres:
    <<: *infra
    image: postgres:16.15-alpine
    command: ['postgres', '-c', 'max_connections=100'] # бюджет — ADR-0004, п. 5
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте в .env}
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 20
    deploy: { resources: { limits: { memory: 512m } } }

  # Идемпотентно создаёт базы и пользователей по infra/postgres/services.txt при каждом up
  db-provision:
    <<: *oneshot
    image: postgres:16.15-alpine
    entrypoint: ['sh', '/provision/provision.sh']
    env_file: [.env]
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes: ['./infra/postgres:/provision:ro']
    depends_on:
      postgres: { condition: service_healthy }

  kafka:
    <<: *infra
    image: apache/kafka:4.3.2
    environment:
      CLUSTER_ID: bWFya2V0cGxhY2UtbG9jYWw # фиксированный: том с данными переживает пересоздание контейнера
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false' # топики только из topics.conf (ADR-0002, п. 1)
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m # без явного heap JVM не укладывается в лимит контейнера
    ports: ['9092:9092']
    volumes: [kafkadata:/var/lib/kafka/data]
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 >/dev/null',
        ]
      interval: 10s
      timeout: 15s
      retries: 15
      start_period: 20s
    deploy: { resources: { limits: { memory: 1g } } }

  # Создаёт и выравнивает топики по infra/kafka/topics.conf
  kafka-init:
    <<: *oneshot
    image: apache/kafka:4.3.2
    entrypoint: ['sh', '/topics/create-topics.sh']
    environment:
      BOOTSTRAP: kafka:29092
      KAFKA_HEAP_OPTS: -Xmx128m
    volumes: ['./infra/kafka:/topics:ro']
    depends_on:
      kafka: { condition: service_healthy }

  kafbat-ui:
    <<: *infra
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      JAVA_OPTS: -XX:MaxRAMPercentage=70
    ports: ['8080:8080']
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8080/actuator/health | grep -q UP']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    depends_on:
      kafka: { condition: service_healthy }
    deploy: { resources: { limits: { memory: 512m } } }

  jaeger:
    <<: *infra
    # 2.21 убрал HTTP API v1 (`/api/services`, поиск `/api/traces`), а источник Jaeger в Grafana
    # 13 работает только через него — до поддержки `/api/v3` в плагине (grafana-jaeger-datasource#87)
    image: jaegertracing/jaeger:2.20.0
    command: ['--config', '/etc/jaeger/config.yaml']
    volumes: ['./infra/jaeger/config.yaml:/etc/jaeger/config.yaml:ro']
    # OTLP принимает внутри сети: трейсы шлёт OpenTelemetry Collector (SD-09, п. 4)
    ports: ['16686:16686']
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:13133/status']
      interval: 5s
      timeout: 3s
      retries: 20
    deploy: { resources: { limits: { memory: 256m } } }

  # OpenTelemetry Collector (SD-09, п. 4): OTLP от сервисов и фронтов; трейсы — в Jaeger,
  # метрики — в Prometheus, lag групп потребителей — из Kafka. Образ distroless: без shell для
  # healthcheck, готовность проверяет infra/smoke.sh по порту 13133
  otel-collector:
    <<: *infra
    image: otel/opentelemetry-collector-contrib:0.162.0
    command: ['--config', '/etc/otelcol/config.yaml']
    volumes: ['./infra/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro']
    ports: ['4318:4318']
    depends_on:
      jaeger: { condition: service_healthy }
      prometheus: { condition: service_healthy }
      kafka: { condition: service_healthy }
    deploy: { resources: { limits: { memory: 256m } } }

  prometheus:
    <<: *infra
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
      # метрики приходят remote write из Collector, сам Prometheus никого не опрашивает
      - --web.enable-remote-write-receiver
    volumes: ['./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro']
    ports: ['9090:9090']
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:9090/-/ready']
      interval: 5s
      timeout: 3s
      retries: 20
    deploy: { resources: { limits: { memory: 512m } } }

  # Grafana (SD-09, решение 6): источники и дашборды — из infra/grafana; вход без пароля, только
  # локальный стенд
  grafana:
    <<: *infra
    image: grafana/grafana:13.2.3
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      # без скачивания и обновления ~15 плагинов с grafana.com при каждом старте: стенду хватает
      # встроенных Prometheus и Jaeger, а каждый установленный плагин — отдельный процесс, и в
      # лимите памяти Grafana перебирала страницы с диска, занимая все ядра
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
      # встроенные источники, кроме Prometheus и Jaeger, тоже не запускаются: процесс на каждый
      GF_PLUGINS_DISABLE_PLUGINS: elasticsearch,grafana-postgresql-datasource,grafana-pyroscope-datasource,influxdb,loki,mssql,mysql,opentsdb,stackdriver,tempo,zipkin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/overview.json
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ['3005:3000']
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/health']
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      prometheus: { condition: service_healthy }
      jaeger: { condition: service_healthy }
    deploy: { resources: { limits: { memory: 256m } } }

  mailpit:
    <<: *infra
    image: axllent/mailpit:v1.31.6
    ports: ['8025:8025', '1025:1025']
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 20
    deploy: { resources: { limits: { memory: 64m } } }
  fake-psp:
    profiles:
      - core
      - full
    build:
      context: .
      dockerfile: apps/fake-psp/Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      PORT: '3000'
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      # браузер покупателя открывает страницу оплаты напрямую, мимо gateway (SD-02, п. 3)
      PSP_PUBLIC_URL: http://localhost:4000
      PSP_WEBHOOK_URL: http://gateway:3000/webhooks/psp
      PSP_WEBHOOK_SECRET: ${PSP_WEBHOOK_SECRET:?задайте в .env}
      PSP_TEST_API: 'true' # локальный стенд и e2e
    ports:
      - 4000:3000
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://localhost:3000/health/ready
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    depends_on:
      otel-collector:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 256m
  payment-migrate:
    profiles:
      - core
      - full
    build:
      context: .
      dockerfile: apps/payment/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgresql://payment_svc:${PAYMENT_DB_PASSWORD}@postgres:5432/payment_db
      # ставка «Телефоны» демо-каталога; категории приходят событиями catalog (SD-05, п. 7)
      SEED_RATES: 'true'
    depends_on:
      db-provision:
        condition: service_completed_successfully
  payment:
    profiles:
      - core
      - full
    build:
      context: .
      dockerfile: apps/payment/Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      PORT: '3000'
      DATABASE_URL: postgresql://payment_svc:${PAYMENT_DB_PASSWORD}@postgres:5432/payment_db
      DB_POOL_MAX: '5'
      KAFKA_BROKERS: kafka:29092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      # провайдер внутри сети compose; webhook от него идёт через gateway (SD-02, п. 3)
      PSP_API_URL: http://fake-psp:3000
      JWKS_URL: http://auth:3000/.well-known/jwks.json
      # куда fake-psp вернёт покупателя после оплаты: страница заказа в витрине (SD-07, п. 3.3)
      PAYMENT_RETURN_URL: http://localhost:3001/orders/{orderId}
      SELLER_HOLD_MS: ${SELLER_HOLD_MS:-604800000}
      MIN_PAYOUT_MINOR: ${MIN_PAYOUT_MINOR:-10000000}
      PSP_WEBHOOK_SECRET: ${PSP_WEBHOOK_SECRET:?задайте в .env}
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://localhost:3000/health/ready
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    depends_on:
      payment-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 256m
  order-migrate:
    profiles:
      - core
      - full
    build:
      context: .
      dockerfile: apps/order/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgresql://order_svc:${ORDER_DB_PASSWORD}@postgres:5432/order_db
    depends_on:
      db-provision:
        condition: service_completed_successfully
  order:
    profiles:
      - core
      - full
    build:
      context: .
      dockerfile: apps/order/Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      PORT: '3000'
      DATABASE_URL: postgresql://order_svc:${ORDER_DB_PASSWORD}@postgres:5432/order_db
      # горячий путь оформления: шесть обработчиков saga и HTTP делят пул (ADR-0004, п. 5; SD-09)
      DB_POOL_MAX: '10'
      KAFKA_BROKERS: kafka:29092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      # ключи JWT до этапа 5 — у gateway (SD-02, п. 3.1)
      JWKS_URL: http://auth:3000/.well-known/jwks.json
      RESERVE_DEADLINE_MS: ${RESERVE_DEADLINE_MS:-30000}
      PAYMENT_DEADLINE_MS: ${PAYMENT_DEADLINE_MS:-900000}
      COMMIT_DEADLINE_MS: ${COMMIT_DEADLINE_MS:-300000}
      CAPTURE_DEADLINE_MS: ${CAPTURE_DEADLINE_MS:-300000}
      CHECKOUT_TICK_MS: ${CHECKOUT_TICK_MS:-5000}
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://localhost:3000/health/ready
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    depends_on:
      order-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 256m
  gateway:
    profiles:
      - core
      - full
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      PORT: '3000'
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      ORDER_URL: http://order:3000
      PAYMENT_URL: http://payment:3000
      ERP_URL: http://erp:3000
      AUTH_URL: http://auth:3000
      CATALOG_URL: http://catalog:3000
      CRM_URL: http://crm:3000
      JWKS_URL: http://auth:3000/.well-known/jwks.json
      # X-Forwarded-For принимается только от фронтов — storefront и backoffice: лимит гостей —
      # по адресам пользователей (SD-07, решение 9; SD-08, п. 3.4)
      TRUST_PROXY: 172.30.240.200,172.30.240.201
    ports:
      - 3000:3000
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://localhost:3000/health/ready
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    depends_on:
      otel-collector:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 256m
  erp-migrate:
    profiles:
      - core
      - full
    build:
      context: .
      dockerfile: apps/erp/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgresql://erp_svc:${ERP_DB_PASSWORD}@postgres:5432/erp_db
      # склады и остатки seed-продавцов до появления кабинета (SD-03, п. 5.1)
      SEED_STOCK: 'true'
      # демо-витрина для ручного просмотра (SD-07, решение 12); e2e выключает
      SEED_SHOWCASE: ${SEED_SHOWCASE:-true}
    depends_on:
      db-provision:
        condition: service_completed_successfully
  erp:
    profiles:
      - core
      - full
    build:
      context: .
      dockerfile: apps/erp/Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      PORT: '3000'
      DATABASE_URL: postgresql://erp_svc:${ERP_DB_PASSWORD}@postgres:5432/erp_db
      DB_POOL_MAX: '5'
      KAFKA_BROKERS: kafka:29092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      JWKS_URL: http://auth:3000/.well-known/jwks.json
      RESERVE_TTL_MS: ${RESERVE_TTL_MS:-1800000}
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://localhost:3000/health/ready
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    depends_on:
      erp-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 256m
  auth-migrate:
    profiles:
      - core
      - full
    build:
      context: .
      dockerfile: apps/auth/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgresql://auth_svc:${AUTH_DB_PASSWORD}@postgres:5432/auth_db
      # тестовые пользователи с общим паролем (решение 6 SD-05); пусто — без них
      DEV_USER_PASSWORD: ${DEV_USER_PASSWORD:-}
    depends_on:
      db-provision:
        condition: service_completed_successfully
  auth:
    profiles:
      - core
      - full
    build:
      context: .
      dockerfile: apps/auth/Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      PORT: '3000'
      DATABASE_URL: postgresql://auth_svc:${AUTH_DB_PASSWORD}@postgres:5432/auth_db
      DB_POOL_MAX: '5'
      KAFKA_BROKERS: kafka:29092
      # первый админ платформы (решение 5 SD-05); пусто — не создаётся
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://localhost:3000/health/ready
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    depends_on:
      auth-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 256m
  catalog-migrate:
    profiles:
      - core
      - full
    build:
      context: .
      dockerfile: apps/catalog/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgresql://catalog_svc:${CATALOG_DB_PASSWORD}@postgres:5432/catalog_db
      # демо-каталог: категории, магазины A и B, товары (решение 6 SD-05)
      SEED_CATALOG: 'true'
      SEED_SHOWCASE: ${SEED_SHOWCASE:-true}
    depends_on:
      db-provision:
        condition: service_completed_successfully
  catalog:
    profiles:
      - core
      - full
    build:
      context: .
      dockerfile: apps/catalog/Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      PORT: '3000'
      DATABASE_URL: postgresql://catalog_svc:${CATALOG_DB_PASSWORD}@postgres:5432/catalog_db
      DB_POOL_MAX: '5'
      KAFKA_BROKERS: kafka:29092
      JWKS_URL: http://auth:3000/.well-known/jwks.json
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://localhost:3000/health/ready
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    depends_on:
      catalog-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 256m
  crm-migrate:
    profiles:
      - core
      - full
    build:
      context: .
      dockerfile: apps/crm/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgresql://crm_svc:${CRM_DB_PASSWORD}@postgres:5432/crm_db
    depends_on:
      db-provision:
        condition: service_completed_successfully
  crm:
    profiles:
      - core
      - full
    build:
      context: .
      dockerfile: apps/crm/Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      PORT: '3000'
      DATABASE_URL: postgresql://crm_svc:${CRM_DB_PASSWORD}@postgres:5432/crm_db
      DB_POOL_MAX: '5'
      KAFKA_BROKERS: kafka:29092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      JWKS_URL: http://auth:3000/.well-known/jwks.json
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://localhost:3000/health/ready
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    depends_on:
      crm-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 256m
  notification-migrate:
    profiles:
      - core
      - full
    build:
      context: .
      dockerfile: apps/notification/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgresql://notification_svc:${NOTIFICATION_DB_PASSWORD}@postgres:5432/notification_db
    depends_on:
      db-provision:
        condition: service_completed_successfully
  notification:
    profiles:
      - core
      - full
    build:
      context: .
      dockerfile: apps/notification/Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      PORT: '3000'
      DATABASE_URL: postgresql://notification_svc:${NOTIFICATION_DB_PASSWORD}@postgres:5432/notification_db
      DB_POOL_MAX: '5'
      KAFKA_BROKERS: kafka:29092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      # письма — в Mailpit: http://localhost:8025 (ТЗ, 3.7)
      SMTP_URL: smtp://mailpit:1025
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://localhost:3000/health/ready
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    depends_on:
      notification-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 256m
  # replay проекций crm (SD-06, п. 5.4): crm остановлен, затем
  #   docker compose --profile core run --rm crm-replay
  crm-replay:
    profiles:
      - tools
    build:
      context: .
      dockerfile: apps/crm/Dockerfile
      target: runtime
    restart: 'no'
    command: ['node', 'dist/replay.js']
    environment:
      DATABASE_URL: postgresql://crm_svc:${CRM_DB_PASSWORD}@postgres:5432/crm_db
      KAFKA_BROKERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # нагрузочный прогон (SD-09, п. 3): apps/load/run.sh. Сценарии — из apps/load, данные и отчёт —
  # в apps/load/test-output
  k6:
    profiles:
      - tools
    image: grafana/k6:2.2.0
    working_dir: /scripts
    volumes:
      - ./apps/load:/scripts:ro
      - ./apps/load/test-output:/out
    environment:
      GATEWAY_URL: http://gateway:3000
      PSP_URL: http://fake-psp:3000
      DEV_USER_PASSWORD: ${DEV_USER_PASSWORD:-}

  # витрина (SD-07, п. 8): только в профиле full, адрес в сети фиксирован — ему доверяет gateway
  storefront:
    profiles:
      - full
    build:
      context: .
      dockerfile: apps/storefront/Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      GATEWAY_URL: http://gateway:3000
      PUBLIC_URL: http://localhost:3001
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - 3001:3001
    networks:
      default:
        ipv4_address: 172.30.240.200
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        # Next слушает IPv4 (HOSTNAME=0.0.0.0), а localhost в контейнере — сначала ::1
        - http://127.0.0.1:3001/health/ready
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    depends_on:
      gateway:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m

  # кабинет продавца и админка (SD-08, п. 3.4): профиль full, фиксированный адрес — как у витрины
  backoffice:
    profiles:
      - full
    build:
      context: .
      dockerfile: apps/backoffice/Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      GATEWAY_URL: http://gateway:3000
      PUBLIC_URL: http://localhost:3002
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - 3002:3002
    networks:
      default:
        ipv4_address: 172.30.240.201
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://127.0.0.1:3002/health/ready
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    depends_on:
      gateway:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m

# подсеть фиксирована ради адресов фронтов; остальные контейнеры получают адреса из нижней
# половины (ip_range), поэтому .200 и .201 никто не займёт раньше витрины и кабинета
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.240.0/24
          ip_range: 172.30.240.0/25

volumes:
  pgdata:
  kafkadata:
