# Локальная инфраструктура (SD-01, п. 5). Запуск: pnpm infra:up (infra/up.sh)
name: marketplace

# Инфраструктура входит во все профили: compose не запускает зависимость из выключенного профиля
x-infra: &infra
  profiles: [infra, core, full]
  restart: unless-stopped

x-oneshot: &oneshot
  profiles: [infra, core, full]
  restart: 'no'

# Инфраструктура ниже; сервисы приложения (<name>-migrate и <name>, профили core/full)
# дописывает в конец генератор: pnpm nx g @repo/generators:service <name>
services:
  postgres:
    <<: *infra
    image: postgres:16.15-alpine
    command: ['postgres', '-c', 'max_connections=100'] # бюджет — ADR-0004, п. 5
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте в .env}
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 20
    deploy: { resources: { limits: { memory: 512m } } }

  # Идемпотентно создаёт базы и пользователей по infra/postgres/services.txt при каждом up
  db-provision:
    <<: *oneshot
    image: postgres:16.15-alpine
    entrypoint: ['sh', '/provision/provision.sh']
    env_file: [.env]
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes: ['./infra/postgres:/provision:ro']
    depends_on:
      postgres: { condition: service_healthy }

  kafka:
    <<: *infra
    image: apache/kafka:4.3.2
    environment:
      CLUSTER_ID: bWFya2V0cGxhY2UtbG9jYWw # фиксированный: том с данными переживает пересоздание контейнера
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false' # топики только из topics.conf (ADR-0002, п. 1)
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m # без явного heap JVM не укладывается в лимит контейнера
    ports: ['9092:9092']
    volumes: [kafkadata:/var/lib/kafka/data]
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 >/dev/null',
        ]
      interval: 10s
      timeout: 15s
      retries: 15
      start_period: 20s
    deploy: { resources: { limits: { memory: 1g } } }

  # Создаёт и выравнивает топики по infra/kafka/topics.conf
  kafka-init:
    <<: *oneshot
    image: apache/kafka:4.3.2
    entrypoint: ['sh', '/topics/create-topics.sh']
    environment:
      BOOTSTRAP: kafka:29092
      KAFKA_HEAP_OPTS: -Xmx128m
    volumes: ['./infra/kafka:/topics:ro']
    depends_on:
      kafka: { condition: service_healthy }

  kafbat-ui:
    <<: *infra
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      JAVA_OPTS: -XX:MaxRAMPercentage=70
    ports: ['8080:8080']
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8080/actuator/health | grep -q UP']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    depends_on:
      kafka: { condition: service_healthy }
    deploy: { resources: { limits: { memory: 512m } } }

  jaeger:
    <<: *infra
    image: jaegertracing/jaeger:2.22.0
    command: ['--config', '/etc/jaeger/config.yaml']
    volumes: ['./infra/jaeger/config.yaml:/etc/jaeger/config.yaml:ro']
    ports: ['16686:16686', '4318:4318']
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:13133/status']
      interval: 5s
      timeout: 3s
      retries: 20
    deploy: { resources: { limits: { memory: 256m } } }

  mailpit:
    <<: *infra
    image: axllent/mailpit:v1.31.6
    ports: ['8025:8025', '1025:1025']
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 20
    deploy: { resources: { limits: { memory: 64m } } }
  fake-psp:
    profiles:
      - core
      - full
    build:
      context: .
      dockerfile: apps/fake-psp/Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      PORT: '3000'
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      # браузер покупателя открывает страницу оплаты напрямую, мимо gateway (SD-02, п. 3)
      PSP_PUBLIC_URL: http://localhost:4000
      PSP_WEBHOOK_URL: http://gateway:3000/webhooks/psp
      PSP_WEBHOOK_SECRET: ${PSP_WEBHOOK_SECRET:?задайте в .env}
      PSP_TEST_API: 'true' # локальный стенд и e2e
    ports:
      - 4000:3000
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://localhost:3000/health/ready
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    depends_on:
      jaeger:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256m
  payment-migrate:
    profiles:
      - core
      - full
    build:
      context: .
      dockerfile: apps/payment/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgresql://payment_svc:${PAYMENT_DB_PASSWORD}@postgres:5432/payment_db
    depends_on:
      db-provision:
        condition: service_completed_successfully
  payment:
    profiles:
      - core
      - full
    build:
      context: .
      dockerfile: apps/payment/Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      PORT: '3000'
      DATABASE_URL: postgresql://payment_svc:${PAYMENT_DB_PASSWORD}@postgres:5432/payment_db
      DB_POOL_MAX: '5'
      KAFKA_BROKERS: kafka:29092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      # провайдер внутри сети compose; webhook от него идёт через gateway (SD-02, п. 3)
      PSP_API_URL: http://fake-psp:3000
      PSP_WEBHOOK_SECRET: ${PSP_WEBHOOK_SECRET:?задайте в .env}
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://localhost:3000/health/ready
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    depends_on:
      payment-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256m

volumes:
  pgdata:
  kafkadata:
