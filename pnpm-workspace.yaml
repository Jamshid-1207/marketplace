packages:
  - 'apps/*'
  - 'libs/*'
  - 'tools/*'

# pnpm 12 не запускает install-скрипты зависимостей без явного разрешения
allowBuilds:
  nx: false
  '@swc/core': false
  '@parcel/watcher': false
  unrs-resolver: false
  protobufjs: false # postinstall только проверяет версию
  ssh2: false # нативное ускорение не нужно: Testcontainers ходит в Docker через сокет
  cpu-features: false
