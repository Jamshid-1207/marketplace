# Настройки стенда для e2e (SD-02, п. 9): поверх compose.yaml.
#   docker compose -f compose.yaml -f compose.e2e.yaml --profile core up -d
# Дедлайны — секунды вместо минут; оплачивает тестовое API fake-psp.
services:
  order:
    environment:
      # с запасом на перезапуск сервиса посреди оплаты: в сценарии 3 webhook доходит через ~70 с —
      # провайдер повторяет его с растущими паузами (сценарии 3, 10)
      PAYMENT_DEADLINE_MS: '120000'
      CAPTURE_DEADLINE_MS: '20000'
      CHECKOUT_TICK_MS: '1000'
  gateway:
    environment:
      # все сценарии идут от нескольких тестовых пользователей подряд
      RATE_LIMIT_PER_MINUTE: '10000'
      DEV_AUTH: 'true'
  fake-psp:
    environment:
      PSP_TEST_API: 'true'
